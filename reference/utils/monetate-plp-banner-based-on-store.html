<script>
    (function suppressorsBannerSuppressorsMonetate() {
        const CONTENTSTACK_BANNER_ID = "suppressors-banner-contentstack";
        const MONETATE_BANNER_ID = "suppressors-banner-monetate";
        const CUSTOM_HEADING_ID = "suppressors-custom-heading";
        const SHOP_BY_CATEGORY_ID = "suppressors-shop-by-category";
        const TARGET_HEADER_SELECTOR = ".contentVerticalMargin--iU1wb";
        const TARGET_TITLE_CONTAINER_SELECTOR = ".title--uBdU5";
        const TARGET_TITLE_SPAN_SELECTOR = ".titleLeftColumn--Z4V1W";
        const INSERTED_ATTR = "data-monetate-suppressors-banner";
        const INSERTED_VAL = "suppressors";
        const BANNER_SOURCE_ATTR = "data-monetate-suppressors-banner-source";
        const BANNER_SOURCE_REPLACEMENT = "replacement";
        const BANNER_SOURCE_FALLBACK = "fallback";
        const HEADER_MODIFIED_ATTR = "data-monetate-suppressors-header-modified";
        const STORAGE_HANDLER_KEY = "suppressorsBannerSuppressorsStorageHandler";
        const STORE_CHANGE_HANDLER_KEY = "suppressorsBannerSuppressorsStoreChangeHandler";
        const LOCAL_STORAGE_PATCH_KEY = "suppressorsBannerSuppressorsLocalStoragePatchApplied";
        const STORE_CHANGE_EVENT = "suppressorsBannerSuppressorsStoreChange";
        const PRESERVED_BANNER_KEY = "suppressorsBannerSuppressorsPreservedContentstackBanner";
        const STORE_TARGETING_ENABLED = true; // Set to false to bypass localStorage store targeting.
        const LOCAL_STORAGE_KEY = "aso_WC_StLocId_Selected";
        const STORE_IDS_CSV_URL = "https://assets.contentstack.io/v3/assets/blt964243cdd7810dea/blt2dbd7663a292e3f6/suppressors-stores.csv?v=1";
        const STORE_IDS_CSV_COLUMNS = ["Store", "Store #"];
        const STORE_GO_LIVE_CSV_COLUMN = "Go Live Date";

        let isUpdating = false;
        let debounceTimer;
        let targetStoreIds = new Set();

        function normalizeStoreId(value) {
            return value == null ? "" : String(value).trim();
        }

        function getLocalStorageStoreId() {
            try {
                const rawValue = window.localStorage.getItem(LOCAL_STORAGE_KEY);
                if (!rawValue) return "";
                const parsedValue = JSON.parse(rawValue);
                return normalizeStoreId(parsedValue && parsedValue.storeId);
            } catch (error) {
                return "";
            }
        }

        function isEligibleStore() {
            return targetStoreIds.has(getLocalStorageStoreId());
        }

        function shouldDisplayBanner() {
            return !STORE_TARGETING_ENABLED || isEligibleStore();
        }

        function parseCsv(csvText) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let index = 0; index < csvText.length; index += 1) {
                const char = csvText[index];
                const nextChar = csvText[index + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        field += '"';
                        index += 1;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === "," && !inQuotes) {
                    row.push(field);
                    field = "";
                } else if ((char === "\n" || char === "\r") && !inQuotes) {
                    if (char === "\r" && nextChar === "\n") {
                        index += 1;
                    }
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = "";
                } else {
                    field += char;
                }
            }

            if (field || row.length) {
                row.push(field);
                rows.push(row);
            }

            const headers = rows.shift();
            if (!headers || !headers.length) return [];

            return rows.map(function (cells) {
                return headers.reduce(function (record, header, headerIndex) {
                    record[header.trim()] = (cells[headerIndex] || "").trim();
                    return record;
                }, {});
            });
        }

        function parseGoLiveDate(value) {
            const dateParts = String(value || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!dateParts) return null;

            const month = Number(dateParts[1]);
            const day = Number(dateParts[2]);
            const year = Number(dateParts[3]);
            const date = new Date(year, month - 1, day);

            if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
                return null;
            }

            return date;
        }

        function getToday() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }

        function loadTargetStoreIds() {
            fetch(STORE_IDS_CSV_URL)
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("Store ID CSV request failed.");
                    }
                    return response.text();
                })
                .then(function (csvText) {
                    const today = getToday();
                    const storeIds = parseCsv(csvText)
                        .filter(function (record) {
                            const goLiveDate = parseGoLiveDate(record[STORE_GO_LIVE_CSV_COLUMN]);
                            return goLiveDate && goLiveDate <= today;
                        })
                        .map(function (record) {
                            const column = STORE_IDS_CSV_COLUMNS.find(function (name) {
                                return normalizeStoreId(record[name]) !== "";
                            });
                            return normalizeStoreId(record[column]);
                        })
                        .filter(Boolean);
                    targetStoreIds = new Set(storeIds);
                    scheduleDOMChanges();
                })
                .catch(function () {
                    // Leave targetStoreIds empty so no store is treated as eligible.
                });
        }

        function dispatchStoreChange() {
            window.dispatchEvent(new Event(STORE_CHANGE_EVENT));
        }

        function installLocalStorageChangeDetection() {
            if (window[LOCAL_STORAGE_PATCH_KEY]) return;

            const originalSetItem = Storage.prototype.setItem;
            const originalRemoveItem = Storage.prototype.removeItem;
            const originalClear = Storage.prototype.clear;

            Storage.prototype.setItem = function (key) {
                const result = originalSetItem.apply(this, arguments);
                if (this === window.localStorage && key === LOCAL_STORAGE_KEY) {
                    dispatchStoreChange();
                }
                return result;
            };

            Storage.prototype.removeItem = function (key) {
                const result = originalRemoveItem.apply(this, arguments);
                if (this === window.localStorage && key === LOCAL_STORAGE_KEY) {
                    dispatchStoreChange();
                }
                return result;
            };

            Storage.prototype.clear = function () {
                const result = originalClear.apply(this, arguments);
                if (this === window.localStorage) {
                    dispatchStoreChange();
                }
                return result;
            };

            window[LOCAL_STORAGE_PATCH_KEY] = true;
        }

        function handleStorageChange(event) {
            if (event.key && event.key !== LOCAL_STORAGE_KEY) return;
            scheduleDOMChanges();
        }

        function scheduleDOMChanges() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(applyDOMChanges, 250);
        }

        function removeInsertedElements() {
            const shopByCategory = document.getElementById(SHOP_BY_CATEGORY_ID);
            const modifiedHeader = document.querySelector(`[${HEADER_MODIFIED_ATTR}="true"]`);

            if (document.getElementById(SHOP_BY_CATEGORY_ID)) {
                const originalTitle = document.querySelector(TARGET_TITLE_SPAN_SELECTOR);
                if (originalTitle) {
                    originalTitle.style.display = "";
                }
            }

            if (shopByCategory && modifiedHeader) {
                modifiedHeader.classList.remove("pb-2", "pb-sm-3", "mb-3", "cont-1656", "hp-margin");
                modifiedHeader.removeAttribute(HEADER_MODIFIED_ATTR);
            }

            document.querySelectorAll(`[${INSERTED_ATTR}="${INSERTED_VAL}"]`).forEach((element) => element.remove());
        }

        function createBannerElement() {
            const wrapper = document.createElement("div");
            wrapper.id = MONETATE_BANNER_ID;
            wrapper.className = "cont-1656 hp-margin mb-3";
            wrapper.setAttribute(INSERTED_ATTR, INSERTED_VAL);
            wrapper.innerHTML = `
                <div class="ssb-banner ssb-banner--targeted corners">
                    <picture class="ssb-background" aria-hidden="true">
                        <source media="(max-width: 767px)" srcset="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt06b1ed3f029d8122/69dc012665ddc676946fcfbf/Targeted_Banner-_Mobile.png">
                        <img loading="lazy" src="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt8aba371c229b2791/69dc01251654a031f94f760b/Banner-_Desktop.png" alt="">
                    </picture>
                    <div class="ssb-inner">
                        <img class="ssb-logo" loading="lazy" src="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt7d33c2911ead0afa/69dc01256fe33207af178155/logo-_Silencer_Shop.png" alt="Silencer Shop">
                        <div class="ssb-store-strip">
                            <span class="ssb-visually-hidden">More Stores Coming Soon</span>
                            <svg class="ssb-store-note-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="217" height="16" fill="none" viewBox="0 0 217 16">

        function removeDuplicateMonetateBanners(primaryBanner) {
            document.querySelectorAll(`#${MONETATE_BANNER_ID}`).forEach((banner) => {
                if (banner !== primaryBanner) {
                    banner.remove();
                }
            });
        }

        function createCustomHeadingElement() {
            const heading = document.createElement("div");
            heading.id = CUSTOM_HEADING_ID;
            heading.className = "cont-1656 hp-margin";
            heading.setAttribute(INSERTED_ATTR, INSERTED_VAL);
            heading.innerHTML = `
                <div class="wcs-heading-row">
                    <h1 class="wcs-heading-title"><a href="#filterBarStickyArea" class="wcs-heading-title-link">Suppressors + Accessories</a></h1>
                    <a href="#filterBarStickyArea" class="wcs-heading-cta">Shop All</a>
                </div>
            `;
            return heading;
        }

        function createShopByCategoryElement() {
            const shopByCategory = document.createElement("div");
            shopByCategory.id = SHOP_BY_CATEGORY_ID;
            shopByCategory.setAttribute(INSERTED_ATTR, INSERTED_VAL);
            shopByCategory.innerHTML = `
                <div class="cont-1656">
                    <div class="hlp-header" style="padding: 0; margin-bottom: 0;">
                        <h2>Shop By Category</h2>
                    </div>
                </div>
            `;
            return shopByCategory;
        }

        function applyShopByCategoryTitle(headerContainer, titleContainer) {
            if (!headerContainer || !titleContainer || titleContainer.querySelector(`#${SHOP_BY_CATEGORY_ID}`)) return;

            const titleSpan = titleContainer.querySelector(TARGET_TITLE_SPAN_SELECTOR);
            if (titleSpan) {
                titleSpan.style.display = "none";
            }

            titleContainer.insertBefore(createShopByCategoryElement(), titleContainer.firstChild);
            headerContainer.classList.add("pb-2", "pb-sm-3", "mb-3", "cont-1656", "hp-margin");
            headerContainer.setAttribute(HEADER_MODIFIED_ATTR, "true");
        }

        function applySuppressorsFallback() {
            const headerContainer = document.querySelector(TARGET_HEADER_SELECTOR);
            const titleContainer = headerContainer ? headerContainer.querySelector(TARGET_TITLE_CONTAINER_SELECTOR) : null;
            if (!headerContainer || !titleContainer || !headerContainer.parentNode) return;

            applyShopByCategoryTitle(headerContainer, titleContainer);

            let customHeading = document.getElementById(CUSTOM_HEADING_ID);
            if (!customHeading) {
                customHeading = createCustomHeadingElement();
                headerContainer.parentNode.insertBefore(customHeading, headerContainer);
            }

            let monetateBanner = document.getElementById(MONETATE_BANNER_ID);
            if (!monetateBanner) {
                monetateBanner = createBannerElement();
            }
            monetateBanner.setAttribute(BANNER_SOURCE_ATTR, BANNER_SOURCE_FALLBACK);

            if (customHeading.nextElementSibling !== monetateBanner) {
                customHeading.insertAdjacentElement("afterend", monetateBanner);
            }

            removeDuplicateMonetateBanners(monetateBanner);
        }

        function restoreOriginalBanner() {
            const monetateBanner = document.getElementById(MONETATE_BANNER_ID);
            const preservedContentstackBanner = window[PRESERVED_BANNER_KEY];
            const shouldRestorePreservedBanner = monetateBanner && preservedContentstackBanner && monetateBanner.getAttribute(BANNER_SOURCE_ATTR) === BANNER_SOURCE_REPLACEMENT;

            if (shouldRestorePreservedBanner) {
                monetateBanner.replaceWith(preservedContentstackBanner);
            } else if (monetateBanner) {
                monetateBanner.remove();
            }

            removeInsertedElements();
        }

        function replaceContentstackBanner(contentstackBanner) {
            removeInsertedElements();
            window[PRESERVED_BANNER_KEY] = contentstackBanner;
            const monetateBanner = createBannerElement();
            monetateBanner.setAttribute(BANNER_SOURCE_ATTR, BANNER_SOURCE_REPLACEMENT);
            contentstackBanner.replaceWith(monetateBanner);
            removeDuplicateMonetateBanners(monetateBanner);
        }

        function applyDOMChanges() {
            if (isUpdating) return;
            isUpdating = true;

            if (!shouldDisplayBanner()) {
                restoreOriginalBanner();
                isUpdating = false;
                return;
            }

            const contentstackBanner = document.getElementById(CONTENTSTACK_BANNER_ID);
            if (contentstackBanner) {
                replaceContentstackBanner(contentstackBanner);
                isUpdating = false;
                return;
            }

            const monetateBanner = document.getElementById(MONETATE_BANNER_ID);
            if (monetateBanner && monetateBanner.getAttribute(BANNER_SOURCE_ATTR) === BANNER_SOURCE_REPLACEMENT && window[PRESERVED_BANNER_KEY]) {
                removeDuplicateMonetateBanners(monetateBanner);
            } else {
                applySuppressorsFallback();
            }

            isUpdating = false;
        }

        function init() {
            applyDOMChanges();
            loadTargetStoreIds();

            if (window.suppressorsBannerSuppressorsObserverInstance) {
                window.suppressorsBannerSuppressorsObserverInstance.disconnect();
            }

            if (window[STORAGE_HANDLER_KEY]) {
                window.removeEventListener("storage", window[STORAGE_HANDLER_KEY]);
            }

            if (window[STORE_CHANGE_HANDLER_KEY]) {
                window.removeEventListener(STORE_CHANGE_EVENT, window[STORE_CHANGE_HANDLER_KEY]);
            }

            installLocalStorageChangeDetection();

            const observer = new MutationObserver(scheduleDOMChanges);

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

            window.suppressorsBannerSuppressorsObserverInstance = observer;
            window[STORAGE_HANDLER_KEY] = handleStorageChange;
            window[STORE_CHANGE_HANDLER_KEY] = scheduleDOMChanges;
            window.addEventListener("storage", window[STORAGE_HANDLER_KEY]);
            window.addEventListener(STORE_CHANGE_EVENT, window[STORE_CHANGE_HANDLER_KEY]);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init, { once: true });
        } else {
            init();
        }
    })();
</script>
