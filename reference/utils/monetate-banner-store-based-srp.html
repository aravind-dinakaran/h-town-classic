<script>
    (function suppressorsSrpMonetate() {
        const BANNER_ID = "suppressors-srp-monetate";
        const CUSTOM_HEADING_ID = "suppressors-srp-custom-heading";
        const SHOP_BY_CATEGORY_ID = "suppressors-srp-shop-by-category";
        const INSERTED_ATTR = "data-monetate-suppressors-srp";
        const INSERTED_VAL = "true";
        const HEADER_MODIFIED_ATTR = "data-monetate-suppressors-srp-header-modified";
        const TARGET_HEADING_SELECTOR = "main h1.titleDisplay, main h1";
        const TARGET_HEADER_SELECTOR = ".contentVerticalMargin--iU1wb";
        const TARGET_TITLE_CONTAINER_SELECTOR = ".title--uBdU5";
        const TARGET_TITLE_SPAN_SELECTOR = ".titleLeftColumn--Z4V1W";
        const OBSERVER_KEY = "suppressorsSrpObserverInstance";
        const STORAGE_HANDLER_KEY = "suppressorsSrpStorageHandler";
        const STORE_CHANGE_HANDLER_KEY = "suppressorsSrpStoreChangeHandler";
        const LOCAL_STORAGE_PATCH_KEY = "suppressorsSrpLocalStoragePatchApplied";
        const STORE_CHANGE_EVENT = "suppressorsSrpStoreChange";
        const STORE_TARGETING_ENABLED = true; // Set to false to always render the targeted banner.
        const LOCAL_STORAGE_KEY = "aso_WC_StLocId_Selected";
        const STORE_IDS_CSV_URL = "https://assets.contentstack.io/v3/assets/blt964243cdd7810dea/blt2dbd7663a292e3f6/suppressors-stores.csv?v=1";
        const STORE_IDS_CSV_COLUMNS = ["Store", "Store #"];
        const STORE_GO_LIVE_CSV_COLUMN = "Go Live Date";
        const BANNER_VARIANT_ATTR = "data-suppressors-srp-banner-variant";
        const DEBOUNCE_MS = 250;

        let isUpdating = false;
        let debounceTimer;
        let targetStoreIds = new Set();

        function normalizeStoreId(value) {
            return value == null ? "" : String(value).trim();
        }

        function getLocalStorageStoreId() {
            try {
                const rawValue = window.localStorage.getItem(LOCAL_STORAGE_KEY);
                if (!rawValue) return "";
                const parsedValue = JSON.parse(rawValue);
                return normalizeStoreId(parsedValue && parsedValue.storeId);
            } catch (error) {
                return "";
            }
        }

        function isEligibleStore() {
            return targetStoreIds.has(getLocalStorageStoreId());
        }

        function shouldDisplayTargetedBanner() {
            return !STORE_TARGETING_ENABLED || isEligibleStore();
        }

        function parseCsv(csvText) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let index = 0; index < csvText.length; index += 1) {
                const char = csvText[index];
                const nextChar = csvText[index + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        field += '"';
                        index += 1;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === "," && !inQuotes) {
                    row.push(field);
                    field = "";
                } else if ((char === "\n" || char === "\r") && !inQuotes) {
                    if (char === "\r" && nextChar === "\n") {
                        index += 1;
                    }
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = "";
                } else {
                    field += char;
                }
            }

            if (field || row.length) {
                row.push(field);
                rows.push(row);
            }

            const headers = rows.shift();
            if (!headers || !headers.length) return [];

            return rows.map(function (cells) {
                return headers.reduce(function (record, header, headerIndex) {
                    record[header.trim()] = (cells[headerIndex] || "").trim();
                    return record;
                }, {});
            });
        }

        function parseGoLiveDate(value) {
            const dateParts = String(value || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!dateParts) return null;

            const month = Number(dateParts[1]);
            const day = Number(dateParts[2]);
            const year = Number(dateParts[3]);
            const date = new Date(year, month - 1, day);

            if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
                return null;
            }

            return date;
        }

        function getToday() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }

        function loadTargetStoreIds() {
            fetch(STORE_IDS_CSV_URL)
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("Store ID CSV request failed.");
                    }
                    return response.text();
                })
                .then(function (csvText) {
                    const today = getToday();
                    const storeIds = parseCsv(csvText)
                        .filter(function (record) {
                            const goLiveDate = parseGoLiveDate(record[STORE_GO_LIVE_CSV_COLUMN]);
                            return goLiveDate && goLiveDate <= today;
                        })
                        .map(function (record) {
                            const column = STORE_IDS_CSV_COLUMNS.find(function (name) {
                                return normalizeStoreId(record[name]) !== "";
                            });
                            return normalizeStoreId(record[column]);
                        })
                        .filter(Boolean);
                    targetStoreIds = new Set(storeIds);
                    schedulePlacement();
                })
                .catch(function () {
                    // Leave targetStoreIds empty so no store is treated as eligible.
                });
        }

        function dispatchStoreChange() {
            window.dispatchEvent(new Event(STORE_CHANGE_EVENT));
        }

        function installLocalStorageChangeDetection() {
            if (window[LOCAL_STORAGE_PATCH_KEY]) return;

            const originalSetItem = Storage.prototype.setItem;
            const originalRemoveItem = Storage.prototype.removeItem;
            const originalClear = Storage.prototype.clear;

            Storage.prototype.setItem = function (key) {
                const result = originalSetItem.apply(this, arguments);
                if (this === window.localStorage && key === LOCAL_STORAGE_KEY) {
                    dispatchStoreChange();
                }
                return result;
            };

            Storage.prototype.removeItem = function (key) {
                const result = originalRemoveItem.apply(this, arguments);
                if (this === window.localStorage && key === LOCAL_STORAGE_KEY) {
                    dispatchStoreChange();
                }
                return result;
            };

            Storage.prototype.clear = function () {
                const result = originalClear.apply(this, arguments);
                if (this === window.localStorage) {
                    dispatchStoreChange();
                }
                return result;
            };

            window[LOCAL_STORAGE_PATCH_KEY] = true;
        }

        function handleStorageChange(event) {
            if (event.key && event.key !== LOCAL_STORAGE_KEY) return;
            schedulePlacement();
        }

        function getTargetHeading() {
            return document.querySelector(TARGET_HEADING_SELECTOR);
        }

        function getInsertedBanners() {
            return Array.from(document.querySelectorAll(`#${BANNER_ID}`));
        }

        function createCustomHeadingElement(headingText) {
            const heading = document.createElement("div");
            heading.id = CUSTOM_HEADING_ID;
            heading.className = "cont-1656 hp-margin";
            heading.setAttribute(INSERTED_ATTR, INSERTED_VAL);
            heading.innerHTML = `
                <div class="wcs-heading-row">
                    <h1 class="wcs-heading-title"></h1>
                </div>
            `;
            heading.querySelector(".wcs-heading-title").textContent = headingText;
            return heading;
        }

        function createShopByCategoryElement() {
            const shopByCategory = document.createElement("div");
            shopByCategory.id = SHOP_BY_CATEGORY_ID;
            shopByCategory.setAttribute(INSERTED_ATTR, INSERTED_VAL);
            shopByCategory.innerHTML = `
                <div class="cont-1656">
                    <div class="hlp-header" style="padding: 0; margin-bottom: 0;">
                        <h2>Shop By Category</h2>
                    </div>
                </div>
            `;
            return shopByCategory;
        }

        function getDefaultBannerMarkup() {
            return `

                    <picture class="ssb-background" aria-hidden="true">
                        <source media="(max-width: 767px)" srcset="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt727eea31e5111f01/69dc012589cfb432393879ad/Default_Banner-_Mobile.png">
                        <img loading="lazy" src="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt8aba371c229b2791/69dc01251654a031f94f760b/Banner-_Desktop.png" alt="">
                    </picture>
                    <div class="ssb-inner">
                        <img class="ssb-logo" loading="lazy" src="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt7d33c2911ead0afa/69dc01256fe33207af178155/logo-_Silencer_Shop.png" alt="Silencer Shop">
                        <img class="ssb-breakline" loading="lazy" src="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt5048fb234d2865fc/69ea931c1513b51e0cd4a48e/Breakline-_m-_New.png" alt="" aria-hidden="true">
                        <div class="ssb-copy">
                            <p class="ssb-title">Firearm Suppressors aren&rsquo;t Available Near You Yet</p>
                            <p class="ssb-subtitle">We&rsquo;re expanding to more stores soon through our partnership with Silencer Shop.</p>
                        </div>
                        <a class="ssb-cta" href="/suppressor-store-locator" aria-label="Learn more about suppressors">Learn More</a>
                    </div>
                </div>
            `;
        }

        function getTargetedBannerMarkup() {
            return `
                <div class="ssb-banner ssb-banner--targeted corners">
                    <picture class="ssb-background" aria-hidden="true">
                        <source media="(max-width: 767px)" srcset="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt06b1ed3f029d8122/69dc012665ddc676946fcfbf/Targeted_Banner-_Mobile.png">
                        <img loading="lazy" src="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt8aba371c229b2791/69dc01251654a031f94f760b/Banner-_Desktop.png" alt="">

                        <div class="ssb-store-strip">

        function getBannerMarkup(variant) {
            return `
                <link rel="preconnect" href="https://fonts.googleapis.com">
                <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
                <link rel="stylesheet"
                    href="https://assets.contentstack.io/v3/assets/blt964243cdd7810dea/blt8c2b98098e8575d5/fonts.css?v=1">
                <link rel="stylesheet"
                    href="https://assets.contentstack.io/v3/assets/blt964243cdd7810dea/blt962bf393a9d818eb/homepage.css?v=39">
                ${variant === "targeted" ? getTargetedBannerMarkup() : getDefaultBannerMarkup()}
            `;
        }

        function updateBannerElement(wrapper, variant) {
            wrapper.setAttribute(BANNER_VARIANT_ATTR, variant);
            wrapper.innerHTML = getBannerMarkup(variant);
        }

        function createBannerElement(variant) {
            const wrapper = document.createElement("div");
            wrapper.id = BANNER_ID;
            wrapper.className = "cont-1656 hp-margin";
            wrapper.setAttribute(INSERTED_ATTR, INSERTED_VAL);
            updateBannerElement(wrapper, variant);
            return wrapper;
        }

        function getOrCreateBanner(variant) {
            const existingBanners = getInsertedBanners();
            const primaryBanner = existingBanners[0] || createBannerElement(variant);

            existingBanners.slice(1).forEach((banner) => banner.remove());

            if (primaryBanner.getAttribute(BANNER_VARIANT_ATTR) !== variant) {
                updateBannerElement(primaryBanner, variant);
            }

            return primaryBanner;
        }

        function hasShopByCategoryListItems() {
            return Boolean(document.querySelector('.asoUI div[role="listitem"]'));
        }

        function applyShopByCategoryTitle(titleContainer, titleSpan) {
            if (!titleContainer || !titleSpan) return;

            const existingShopByCategory = titleContainer.querySelector(`#${SHOP_BY_CATEGORY_ID}`);

            if (hasShopByCategoryListItems()) {
                if (!existingShopByCategory) {
                    titleContainer.insertBefore(createShopByCategoryElement(), titleContainer.firstChild);
                }
            } else if (existingShopByCategory) {
                existingShopByCategory.remove();
            }

            // titleSpan.style.display = "none";

            const headerContainer = titleContainer.closest(TARGET_HEADER_SELECTOR);
            if (headerContainer) {
                headerContainer.classList.add("pb-2", "pb-sm-3", "mb-3", "cont-1656", "hp-margin");
                headerContainer.setAttribute(HEADER_MODIFIED_ATTR, "true");
                headerContainer.style.display = "none";
            }
        }

        function getOrCreateCustomHeading(headingText, headerContainer) {
            let customHeading = document.getElementById(CUSTOM_HEADING_ID);

            if (!customHeading) {
                customHeading = createCustomHeadingElement(headingText);
            } else {
                const titleNode = customHeading.querySelector(".wcs-heading-title");
                if (titleNode && titleNode.textContent !== headingText) {
                    titleNode.textContent = headingText;
                }
            }

            if (headerContainer && customHeading.nextElementSibling !== headerContainer) {
                headerContainer.parentNode.insertBefore(customHeading, headerContainer);
            }

            return customHeading;
        }

        function placeBanner() {
            if (isUpdating) return;
            isUpdating = true;

            const targetHeading = getTargetHeading();
            const titleSpan = targetHeading ? targetHeading.closest(TARGET_TITLE_SPAN_SELECTOR) : null;
            const titleContainer = targetHeading ? targetHeading.closest(TARGET_TITLE_CONTAINER_SELECTOR) : null;
            const headerContainer = targetHeading ? targetHeading.closest(TARGET_HEADER_SELECTOR) : null;

            if (!targetHeading || !titleSpan || !titleContainer || !headerContainer || !headerContainer.parentNode) {
                isUpdating = false;
                return;
            }

            applyShopByCategoryTitle(titleContainer, titleSpan);

            const customHeading = getOrCreateCustomHeading(targetHeading.textContent.trim(), headerContainer);
            const banner = getOrCreateBanner(shouldDisplayTargetedBanner() ? "targeted" : "default");
            if (customHeading.nextElementSibling !== banner) {
                customHeading.insertAdjacentElement("afterend", banner);
            }

            isUpdating = false;
        }

        function schedulePlacement() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(placeBanner, DEBOUNCE_MS);
        }

        function init() {
            placeBanner();
            loadTargetStoreIds();

            if (window[OBSERVER_KEY]) {
                window[OBSERVER_KEY].disconnect();
            }

            if (window[STORAGE_HANDLER_KEY]) {
                window.removeEventListener("storage", window[STORAGE_HANDLER_KEY]);
            }

            if (window[STORE_CHANGE_HANDLER_KEY]) {
                window.removeEventListener(STORE_CHANGE_EVENT, window[STORE_CHANGE_HANDLER_KEY]);
            }

            const observer = new MutationObserver(schedulePlacement);
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

            installLocalStorageChangeDetection();

            window[OBSERVER_KEY] = observer;
            window[STORAGE_HANDLER_KEY] = handleStorageChange;
            window[STORE_CHANGE_HANDLER_KEY] = schedulePlacement;
            window.addEventListener("storage", window[STORAGE_HANDLER_KEY]);
            window.addEventListener(STORE_CHANGE_EVENT, window[STORE_CHANGE_HANDLER_KEY]);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init, { once: true });
        } else {
            init();
        }
    })();
