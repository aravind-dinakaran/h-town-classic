<script>
    (function () {
        var root = document.getElementById("c2_stack_1");
        if (!root) return;

        var playIconUrl = "https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltfb7f6e5f516cd86b/68dbe6f04983061fa4f367e1/button_play_default.svg";
        var pauseIconUrl = "https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltbb12959797e4cc5a/68dbe6f05b98db396064ec16/button_pause_default.svg";

        function setButtonState(button, icon, playing) {
            if (!button || !icon) return;
            icon.src = playing ? pauseIconUrl : playIconUrl;
            icon.alt = playing ? "Pause video" : "Play video";
            button.setAttribute("aria-label", playing ? "Pause video" : "Play video");
        }

        root.querySelectorAll(".card_gif").forEach(function (gif) {
            var card = gif.closest(".card-item");
            if (!card) return;
            var canvas = card.querySelector(".canvas");
            var button = card.querySelector(".video-control-button");
            var icon = card.querySelector(".play-pause-icon");
            if (!canvas || !button || !icon) return;

            var ctx = canvas.getContext("2d");
            var gifUrl = gif.getAttribute("src") || "";
            var isPlaying = true;

            function freezeFrame() {
                canvas.width = gif.naturalWidth || gif.clientWidth;
                canvas.height = gif.naturalHeight || gif.clientHeight;
                try {
                    ctx.drawImage(gif, 0, 0, canvas.width, canvas.height);
                } catch (error) {
                    canvas.style.backgroundColor = "#333333";
                }
                gif.style.display = "none";
                canvas.style.display = "block";
            }

            function playGif() {
                canvas.style.display = "none";
                gif.style.display = "block";
                gif.src = gifUrl + (gifUrl.indexOf("?") === -1 ? "?t=" : "&t=") + Date.now();
                isPlaying = true;
                setButtonState(button, icon, true);
            }

            function pauseGif() {
                freezeFrame();
                gif.src = "";
                isPlaying = false;
                setButtonState(button, icon, false);
            }

            button.addEventListener("click", function (event) {
                event.preventDefault();
                event.stopPropagation();
                if (isPlaying) {
                    pauseGif();
                } else {
                    playGif();
                }
            });

            setButtonState(button, icon, true);
        });

        root.querySelectorAll("video").forEach(function (video) {
            var card = video.closest(".card-item");
            if (!card) return;
            var button = card.querySelector(".video-control-button");
            var icon = card.querySelector(".play-pause-icon");
            if (!button || !icon) return;

            video.addEventListener("play", function () {
                setButtonState(button, icon, true);
            });
            video.addEventListener("pause", function () {
                setButtonState(button, icon, false);
            });

            button.addEventListener("click", function (event) {
                event.preventDefault();
                event.stopPropagation();
                if (video.paused) {
                    var playAttempt = video.play();
                    setButtonState(button, icon, true);
                    if (playAttempt && typeof playAttempt.catch === "function") {
                        playAttempt.catch(function () {
                            setButtonState(button, icon, false);
                        });
                    }
                } else {
                    video.pause();
                    setButtonState(button, icon, false);
                }
            });

            setButtonState(button, icon, true);
        });
    })();
</script>
