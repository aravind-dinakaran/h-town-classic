<style>
    /*
      Fill-then-scroll (shared with scrollable_cards.html):
      - At cont-1656, --card-count cards share the row with --card-gap.
      - As the row narrows, card width shrinks with the container.
      - Once calc drops below --card-min-width, cards stop shrinking and the row scrolls.
    */
    #scrollable-cards .scrollable-card-wrapper {
        --card-gap: clamp(14px, 0.97vw, 16px);
        --card-count: 5;
        --card-min-width: 225px;
        --card-title-gap: 16px;
        --prev-btn-hover-img: url('https://images.contentstack.io/v3/assets/blt964243cdd7810dea/blt85d13c756fd4c87f/6668cc8105319148701f3beb/left-arrow_hover.svg');
        --next-btn-hover-img: url('https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltc1bb7050ac69c4dc/6668c1d8a70874062b612002/arrow_hover.svg');
    }

    #scrollable-cards .scrollable-container {
        display: flex;
        align-items: flex-start;
        flex-wrap: nowrap;
        gap: var(--card-gap);
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        position: relative;
    }

    #scrollable-cards .scrollable-container::-webkit-scrollbar {
        display: none;
    }

    #scrollable-cards .scrollable-card {
        box-sizing: border-box;
        flex: 0 0 calc((100% - (var(--card-gap) * (var(--card-count) - 1))) / var(--card-count));
        min-width: var(--card-min-width);
        max-width: calc((1656px - (var(--card-gap) * (var(--card-count) - 1))) / var(--card-count));
        overflow: hidden;
        position: relative;
        color: #000;
        text-decoration: none;
    }

    #scrollable-cards picture {
        display: block;
        overflow: hidden;
        width: 100%;
    }

    /* Card owns width; image fills it. Override global count-based clamp/min-width. */
    #scrollable-cards .scrollable-card-count-based-width {
        aspect-ratio: 318 / 438;
        display: block;
        height: auto;
        max-width: 100% !important;
        min-width: 0 !important;
        object-fit: cover;
        width: 100% !important;
    }

    #scrollable-cards .card-subtitle {
        margin-top: var(--card-title-gap);
        padding-top: 0;
        text-align: center;
    }

    #scrollable-cards .text-card-subtitle {
        color: #000;
        display: block;
        font-family: 'Open Sans', sans-serif;
        font-size: clamp(16px, 1.21vw, 20px);
        font-weight: 600;
        line-height: 1.2;
    }

    #scrollable-cards .scrollable-card:hover .text-card-subtitle {
        text-decoration: underline;
    }

    /* Nav arrows (shown by JS only when desktop + overflow) */
    #scrollable-cards .css-scroll-btn {
        top: 45%;
        z-index: 2;
    }

    @media (max-width: 767px) {
        #scrollable-cards .scrollable-card-wrapper {
            --card-gap: 16px;
            --card-min-width: 225px;
            --card-title-gap: 8.72px;
        }

        #scrollable-cards .scrollable-container {
            padding-right: 16px;
        }

        #scrollable-cards .scrollable-card-count-based-width {
            aspect-ratio: 225 / 310;
        }

        #scrollable-cards .text-card-subtitle {
            font-size: 16px;
        }

        #scrollable-cards .css-scroll-btn {
            display: none !important;
        }
    }
</style>

<script>
    (function () {
        function initScrollableCardsScroll() {
            const root = document.getElementById("scrollable-cards");
            if (!root) return;

            const container = root.querySelector(".scrollable-container");
            const prevButton = root.querySelector(".css-scroll-btn-prev");
            const nextButton = root.querySelector(".css-scroll-btn-next");

            if (!container || !prevButton || !nextButton) return;

            function isDesktop() {
                return window.innerWidth > 767;
            }

            function getCardCount() {
                const wrapper = root.querySelector(".scrollable-card-wrapper");
                const raw = wrapper ? getComputedStyle(wrapper).getPropertyValue("--card-count").trim() : "";
                const parsed = parseInt(raw, 10);
                return Number.isFinite(parsed) && parsed > 0 ? parsed : 3;
            }

            function calculateScrollAmount() {
                const firstCard = container.querySelector(".scrollable-card");
                if (!firstCard) return container.clientWidth;

                const styles = getComputedStyle(container);
                const gap = parseFloat(styles.columnGap || styles.gap) || 16;
                const cardWidth = firstCard.offsetWidth + gap;
                const visibleCards = isDesktop() ? getCardCount() : 1;

                return cardWidth * visibleCards;
            }

            function updateButtonVisibility() {
                const maxScrollLeft = container.scrollWidth - container.clientWidth;

                if (isDesktop() && maxScrollLeft > 1) {
                    prevButton.style.display = container.scrollLeft > 1 ? "block" : "none";
                    nextButton.style.display = container.scrollLeft < maxScrollLeft - 1 ? "block" : "none";
                } else {
                    prevButton.style.display = "none";
                    nextButton.style.display = "none";
                }
            }

            nextButton.addEventListener("click", function () {
                container.scrollBy({ left: calculateScrollAmount(), behavior: "smooth" });
            });

            prevButton.addEventListener("click", function () {
                container.scrollBy({ left: -calculateScrollAmount(), behavior: "smooth" });
            });

            container.addEventListener("scroll", updateButtonVisibility);
            window.addEventListener("resize", updateButtonVisibility);

            if ("ResizeObserver" in window) {
                new ResizeObserver(updateButtonVisibility).observe(container);
            }

            updateButtonVisibility();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initScrollableCardsScroll);
        } else {
            initScrollableCardsScroll();
        }
    })();
</script>
