<!-- Slider Functionality -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>

<script>
    (function () {
        const sliderEl = document.getElementById("c2HeroSlider");
        const playPauseBtn = document.getElementById("c2HeroPlayPauseBtn");

        if (!sliderEl || !playPauseBtn || typeof bootstrap === "undefined") {
            return;
        }

        if (sliderEl.dataset.c2CarouselInitialized === "true") {
            return;
        }

        sliderEl.dataset.c2CarouselInitialized = "true";

        const pauseSrc = "https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltbb12959797e4cc5a/68dbe6f05b98db396064ec16/button_pause_default.svg";
        const playSrc = "https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltfb7f6e5f516cd86b/68dbe6f04983061fa4f367e1/button_play_default.svg";
        const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let isPaused = reduceMotion;

        const existingCarousel = bootstrap.Carousel.getInstance(sliderEl);

        if (existingCarousel) {
            existingCarousel.dispose();
        }

        const bsCarousel = new bootstrap.Carousel(sliderEl, {
            interval: 5000,
            pause: false,
            ride: false
        });

        function setPlayPauseIcon(paused) {
            const icon = playPauseBtn.querySelector(".c2-play-pause-icon");
            const action = paused ? "Play" : "Pause";
            const label = action + " carousel and video";

            if (icon) {
                icon.src = paused ? playSrc : pauseSrc;
                icon.alt = label;
            }

            playPauseBtn.setAttribute("aria-label", label);
        }

        function getActiveSlide() {
            return sliderEl.querySelector(".carousel-item.active");
        }

        function setVideoPaused(video, paused) {
            if (!video) {
                return;
            }

            if (paused) {
                video.pause();
                return;
            }

            const playPromise = video.play();

            if (playPromise && typeof playPromise.catch === "function") {
                playPromise.catch(function () {});
            }
        }

        function syncVideos() {
            const activeSlide = getActiveSlide();

            sliderEl.querySelectorAll("video").forEach(function (video) {
                const shouldPlay = activeSlide && activeSlide.contains(video) && !isPaused;
                setVideoPaused(video, !shouldPlay);
            });
        }

        function findBarFor(overlay) {
            let sibling = overlay.previousElementSibling;

            while (sibling) {
                if (sibling.classList.contains("c2-details-bar") || sibling.classList.contains("c2-countdown-bar")) {
                    return sibling;
                }

                sibling = sibling.previousElementSibling;
            }

            return null;
        }

        function syncBarOffsets() {
            sliderEl.querySelectorAll(".text-overlay-top-left").forEach(function (overlay) {
                const bar = findBarFor(overlay);

                if (!bar) {
                    return;
                }

                // offsetHeight is 0 for slides Bootstrap has hidden; skip them and
                // recompute when they become visible (slide/slid/resize events).
                const barHeight = bar.offsetHeight;

                if (barHeight > 0) {
                    overlay.style.top = barHeight + "px";
                }
            });
        }

        let barOffsetRaf = null;

        function scheduleBarOffsetSync() {
            if (barOffsetRaf) {
                window.cancelAnimationFrame(barOffsetRaf);
            }

            barOffsetRaf = window.requestAnimationFrame(function () {
                barOffsetRaf = null;
                syncBarOffsets();
            });
        }

        function formatStandardCountdown(distance) {
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            const mm = minutes < 10 ? "0" + minutes : minutes;
            const ss = seconds < 10 ? "0" + seconds : seconds;
            let output = "";

            if (days >= 1) {
                output += days + "d ";
            }

            if (hours > 0) {
                output += hours + "h ";
            }

            if (minutes > 0) {
                output += mm + "m ";
            }

            if (hours === 0 && seconds > 0) {
                output += ss + "s ";
            }

            return output.trim();
        }

        function formatMotherDayCountdown(distance) {
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));

            if (days > 1) {
                return days + " Days Until Mother's Day";
            }

            if (days === 1) {
                return "Tomorrow is Mother's Day";
            }

            return "It's Mother's Day";
        }

        function updateCountdowns() {
            const now = Date.now();

            sliderEl.querySelectorAll(".c2-countdown[data-countdown-end]").forEach(function (el) {
                const endTime = new Date(el.dataset.countdownEnd).getTime();

                if (Number.isNaN(endTime)) {
                    return;
                }

                const distance = endTime - now;

                if (distance <= 0) {
                    el.textContent = el.dataset.countdownExpired || "00h";
                    return;
                }

                el.textContent = el.dataset.countdownMode === "mother-day"
                    ? formatMotherDayCountdown(distance)
                    : formatStandardCountdown(distance);
            });
        }

        if (isPaused) {
            bsCarousel.pause();
        } else {
            bsCarousel.cycle();
        }

        setPlayPauseIcon(isPaused);
        updateCountdowns();
        syncVideos();
        syncBarOffsets();

        sliderEl.addEventListener("slide.bs.carousel", function () {
            sliderEl.querySelectorAll("video").forEach(function (video) {
                video.pause();
            });

            scheduleBarOffsetSync();
        });

        sliderEl.addEventListener("slid.bs.carousel", function () {
            syncVideos();
            scheduleBarOffsetSync();
        });

        window.addEventListener("resize", scheduleBarOffsetSync);

        if (typeof ResizeObserver === "function") {
            const barObserver = new ResizeObserver(scheduleBarOffsetSync);

            sliderEl.querySelectorAll(".c2-details-bar, .c2-countdown-bar").forEach(function (bar) {
                barObserver.observe(bar);
            });
        }

        playPauseBtn.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();

            isPaused = !isPaused;

            if (isPaused) {
                bsCarousel.pause();
            } else {
                bsCarousel.cycle();
            }

            setPlayPauseIcon(isPaused);
            syncVideos();
        });

        window.setInterval(updateCountdowns, 1000);
    })();
</script>
