                            srcset="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltc0a33add4796faa4/6a345e1245496a4b4cecd37a/New_Finds_Supra_Bat-m.png?auto=webp&format=jpg">
                        <img loading="lazy"
                            src="https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltc0a33add4796faa4/6a345e1245496a4b4cecd37a/New_Finds_Supra_Bat-m.png?auto=webp&format=jpg"

                    aria-label="Scroll to next cards" style="display: none;">

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const root = document.getElementById("c6-scrollD-stackM");

        if (!root) {
            return;
        }

        // ---------------------------------------------------------------
        // Responsive video sources (desktop vs mobile crop)
        // ---------------------------------------------------------------
        (function initResponsiveVideoSources() {
            const mq = window.matchMedia("(max-width: 767px)");

            root.querySelectorAll("video[data-src-desktop]").forEach(function (video) {
                const source = video.querySelector("source");

                if (!source) {
                    return;
                }

                function applySource() {
                    const desired = mq.matches
                        ? video.getAttribute("data-src-mobile")
                        : video.getAttribute("data-src-desktop");

                    if (desired && source.getAttribute("src") !== desired) {
                        source.setAttribute("src", desired);
                        video.load();
                    }
                }

                applySource();
                mq.addEventListener("change", applySource);
            });
        })();

        // ---------------------------------------------------------------
        // Horizontal scroll controls (desktop only)
        // ---------------------------------------------------------------
        (function initScrollControls() {
            const container = root.querySelector(".scrollable-container");
            const prevButton = root.querySelector(".css-scroll-btn-prev");
            const nextButton = root.querySelector(".css-scroll-btn-next");

            if (!container || !prevButton || !nextButton) {
                return;
            }

            function calculateScrollAmount() {
                const firstCard = container.querySelector(".scrollable-card");

                if (!firstCard) {
                    return container.clientWidth;
                }

                const gap = parseFloat(getComputedStyle(container).columnGap) || 15;
                const cardWidth = firstCard.offsetWidth + gap;
                const visibleCards = window.innerWidth > 768 ? 4 : 1;

                return cardWidth * visibleCards;
            }

            function updateButtonVisibility() {
                const maxScrollLeft = container.scrollWidth - container.clientWidth;

                if (window.innerWidth > 768) {
                    prevButton.style.display = container.scrollLeft > 0 ? "block" : "none";
                    nextButton.style.display = container.scrollLeft < (maxScrollLeft - 1) ? "block" : "none";
                } else {
                    prevButton.style.display = "none";
                    nextButton.style.display = "none";
                }
            }

            nextButton.addEventListener("click", function () {
                container.scrollBy({ left: calculateScrollAmount(), behavior: "smooth" });
            });

            prevButton.addEventListener("click", function () {
                container.scrollBy({ left: -calculateScrollAmount(), behavior: "smooth" });
            });

            container.addEventListener("scroll", updateButtonVisibility);
            window.addEventListener("resize", updateButtonVisibility);

            updateButtonVisibility();
        })();

        // ---------------------------------------------------------------
        // Video cards (generic — handles 0, 1, 2, or more video cards)
        // Each video: auto-plays once when >= 25% visible, replays once if
        // it leaves and returns to view, and pauses when scrolled away.
        // The play/pause button toggles playback without following the link.
        // ---------------------------------------------------------------
        (function initVideoCards() {
            const playIconUrl =
                "https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltfb7f6e5f516cd86b/68dbe6f04983061fa4f367e1/button_play_default.svg";
            const pauseIconUrl =
                "https://images.contentstack.io/v3/assets/blt964243cdd7810dea/bltbb12959797e4cc5a/68dbe6f05b98db396064ec16/button_pause_default.svg";

            root.querySelectorAll(".scrollable-card video").forEach(function (video) {
                const card = video.closest(".scrollable-card");
                const button = card ? card.querySelector(".video-control-button") : null;
                const icon = button ? button.querySelector(".play-pause-icon") : null;

                let hasAutoPlayedOnce = false;
                let hasExitedAfterAutoPlay = false;
                let hasAutoReplayedOnce = false;

                function setIcon(isPaused) {
                    if (!icon || !button) {
                        return;
                    }

                    icon.src = isPaused ? playIconUrl : pauseIconUrl;
                    icon.alt = isPaused ? "Play video" : "Pause video";
                    button.setAttribute("aria-label", isPaused ? "Play video" : "Pause video");
                }

                function playFromStart() {
                    try {
                        video.currentTime = 0;
                    } catch (e) { }

                    const playAttempt = video.play();

                    if (playAttempt && typeof playAttempt.catch === "function") {
                        playAttempt.catch(function () {
                            setIcon(true);
                        });
                    }
                }

                video.addEventListener("play", function () { setIcon(false); });
                video.addEventListener("pause", function () { setIcon(true); });
                video.addEventListener("ended", function () { setIcon(true); });

                if (button) {
                    button.addEventListener("click", function (event) {
                        event.preventDefault();
                        event.stopPropagation();

                        if (video.paused) {
                            const nearEnd =
                                video.duration &&
                                video.currentTime >= Math.max(0, video.duration - 0.05);

                            if (video.ended || nearEnd) {
                                playFromStart();
                            } else {
                                const playAttempt = video.play();

                                if (playAttempt && typeof playAttempt.catch === "function") {
                                    playAttempt.catch(function () {
                                        setIcon(true);
                                    });
                                }
                            }
                        } else {
                            video.pause();
                        }
                    });
                }

                const observer = new IntersectionObserver(
                    function (entries) {
                        entries.forEach(function (entry) {
                            const isAtLeastQuarterVisible =
                                entry.isIntersecting && entry.intersectionRatio >= 0.25;

                            if (isAtLeastQuarterVisible) {
                                if (!hasAutoPlayedOnce) {
                                    hasAutoPlayedOnce = true;
                                    playFromStart();
                                    return;
                                }

                                if (hasExitedAfterAutoPlay && !hasAutoReplayedOnce) {
                                    hasAutoReplayedOnce = true;
                                    playFromStart();
                                    return;
                                }
                            } else {
                                if (hasAutoPlayedOnce) {
                                    hasExitedAfterAutoPlay = true;
                                }

                                if (!video.paused) {
                                    video.pause();
                                }
                            }
                        });
                    },
                    { threshold: [0, 0.25] }
                );

                setIcon(false);
                observer.observe(card || video);
            });
        })();
    });
</script>
